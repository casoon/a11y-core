[workspace]
members = ["crates/a11y-report"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/casoon/a11y-core"
rust-version = "1.85"
authors = ["Jörn Seidel <info@casoon.de>"]
categories = ["accessibility", "web-programming"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
