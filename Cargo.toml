[workspace]
members = ["crates/a11y-report", "crates/a11y-dom", "crates/accname", "crates/a11y-rules"]
resolver = "2"

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/casoon/a11y-core"
rust-version = "1.85"
authors = ["Jörn Seidel <info@casoon.de>"]
categories = ["accessibility", "web-programming"]

[workspace.dependencies]
a11y-report = { version = "0.10.0", path = "crates/a11y-report" }
a11y-dom = { version = "0.10.0", path = "crates/a11y-dom" }
accname = { version = "0.10.0", path = "crates/accname" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
